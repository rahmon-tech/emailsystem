name: Verify EmailSystem
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Full Quality verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: emailsystem_test
          POSTGRES_USER: emailsystem
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emailsystem -d emailsystem_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://emailsystem:ephemeral-ci-only@localhost:5432/emailsystem_test
      REDIS_URL: redis://localhost:6379
      APP_URL: https://localhost:3443/emailblast
      NEXT_PUBLIC_BASE_PATH: /emailblast
      ALLOW_MOCK_PROVIDER: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
      - name: Generate ephemeral application keys
        run: |
          session_key="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -hex 32)"
          echo "::add-mask::$session_key"
          echo "::add-mask::$encryption_key"
          echo "SESSION_SECRET=$session_key" >> "$GITHUB_ENV"
          echo "CREDENTIAL_ENCRYPTION_KEY=$encryption_key" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high and critical)
        run: pnpm audit:prod
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations to fresh PostgreSQL
        run: pnpm db:migrate
      - name: Verify migration matches schema
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema packages/db/schema.prisma --exit-code
      - name: Rehearse upgrade from verified provider milestone
        run: node --import tsx scripts/verify-safety-upgrade.ts
      - name: Lint source
        run: pnpm lint
      - name: Scan repository for secrets
        run: pnpm secrets:scan
      - name: Typecheck TypeScript
        run: pnpm typecheck
      - name: Run unit tests with critical coverage visibility
        run: |
          mkdir -p test-results/coverage
          pnpm test:coverage | tee test-results/coverage/unit.txt
      - name: Run integration tests with critical coverage visibility
        run: |
          mkdir -p test-results/coverage
          pnpm test:integration:coverage | tee test-results/coverage/integration.txt
      - name: Build production web application
        run: pnpm build
        id: web_build
        env:
          NODE_ENV: production
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: pnpm test:e2e
        env:
          NODE_ENV: production
      - name: Emit screenshots for visual review
        if: always()
        run: node --import tsx scripts/emit-visual-review.ts
      - name: Validate production containers
        if: ${{ !cancelled() && steps.web_build.outcome == 'success' }}
        run: |
          node --import tsx scripts/setup-env.ts ci.example.com /emailblast
          docker compose config --quiet
          docker compose -p emailblast-ci -f compose.yaml -f compose.shared.yaml config --quiet
          docker compose run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose build web
          image_size="$(docker image inspect emailsystem:local --format '{{.Size}}')"
          echo "Production image size: $image_size bytes"
          test "$image_size" -lt 1500000000
          docker run --rm --entrypoint node emailsystem:local --import tsx -e "process.exit(0)"
          docker compose up -d postgres redis
          docker compose run --rm web node node_modules/prisma/build/index.js migrate deploy
          if ! docker compose up -d --wait web worker; then
            mkdir -p test-results/server-logs
            echo "::group::Production container status"
            docker compose ps -a | tee test-results/server-logs/production-containers-status.log || true
            echo "::endgroup::"
            echo "::group::Production web/worker logs"
            docker compose logs --no-color --tail=200 web worker | tee test-results/server-logs/production-containers.log || true
            echo "::endgroup::"
            docker compose down || true
            exit 1
          fi
          docker compose exec -T web node -e "fetch('http://localhost:3000/emailblast/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker compose exec -T worker node --import tsx scripts/worker-health.ts
          docker compose down
      - name: Collect server diagnostics
        if: always()
        run: |
          mkdir -p test-results/server-logs
          cp /tmp/emailsystem-e2e-*.log test-results/server-logs/ 2>/dev/null || true
      - name: Upload browser verification artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
