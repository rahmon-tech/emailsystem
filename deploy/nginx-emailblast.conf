# Include INSIDE the existing HTTPS server for app.promptologoy.com.
# Keep its existing root location and other projects unchanged.
location = /emailblast {
    return 302 /emailblast/providers;
}
location ^~ /emailblast/ {
    proxy_pass http://127.0.0.1:3087;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 90s;
    client_max_body_size 26m;
    # No per-request access logs containing link tokens, IPs or user agents.
    access_log off;
}
