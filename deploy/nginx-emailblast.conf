# Example path-prefixed Nginx route.
# Include inside the HTTPS server block for your chosen application hostname.
# Adjust the base path and loopback port to match your installation.

location = /emailblast {
    return 302 /emailblast/providers;
}

location ^~ /emailblast/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    proxy_buffering off;
    proxy_read_timeout 90s;
    client_max_body_size 26m;

    # Minimize logging for routes that can contain opaque redirect tokens.
    access_log off;
}
