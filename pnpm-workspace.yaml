packages:
  - apps/*
  - packages/*
minimumReleaseAge: 1440
# Prisma 7.10.0 still resolves two high-severity vulnerable transitive versions;
# keep these edges pinned to patched releases until upstream no longer needs overrides.
overrides:
  '@prisma/config>deepmerge-ts': 8.0.2
  brace-expansion@<1.1.19: ^1.1.19
  brace-expansion@<1.1.20: ^1.1.20
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.5: ^2.1.5
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  effect@<=3.22.0: ^3.22.1
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  fast-uri@>=3.1.3 <3.1.9: ^3.1.9
  'html-to-text>deepmerge-ts': 8.0.2
  mysql2@<=3.23.0: ^3.23.1
  next@>=16.0.0 <=16.4.4: ^16.4.5
  next@>=16.2.0 <=16.4.4: ^16.4.5
  next@>=16.3.0 <=16.4.4: ^16.4.5
  next@>=16.4.0 <=16.4.4: ^16.4.5
  nodemailer@>=3.0.0 <10.1.4: ^10.1.4
  nodemailer@>=3.0.0 <=10.0.12: ^10.0.13
  nodemailer@>=3.0.0 <=10.0.9: ^10.0.10
  'prisma>mysql2': 3.22.0
  sanitize-html@<2.18.0: ^2.18.0
  sanitize-html@>=2.17.7 <2.18.0: ^2.18.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  undici@>=7.0.0 <7.30.1: ^7.30.1
  undici@>=7.15.0 <7.30.1: ^7.30.1
  undici@>=7.18.0 <7.30.1: ^7.30.1
  uuid@<11.1.1: ^11.1.1
allowBuilds:
  '@prisma/engines': true
  prisma: true
  sharp: true
  esbuild: true
  msgpackr-extract: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - uuid@11.1.1
  - mysql2@3.23.1
  - fast-uri@3.1.8 || 3.1.9
  - brace-expansion@1.1.19 || 1.1.20 || 1.1.21 || 2.1.5 || 2.1.6 || 2.1.7
  - source-map-js@1.2.2
  - sanitize-html@2.18.0
  - nodemailer@10.0.10 || 10.0.13 || 10.1.4
  - undici@7.30.1
  - next@16.4.5
  - effect@3.22.1
